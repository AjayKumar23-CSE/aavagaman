name: ride_shared
description: Shared API client, models, theme and widgets for the rider and driver apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_riverpod: ^3.4.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  sentry_flutter: ^9.30.1
  package_info_plus: ^10.2.1
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.3
  google_maps_flutter: ^2.18.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  assets:
    - assets/car_marker.png
    - assets/splash_india_gate.jpg
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: fonts/PlusJakartaSans-800.ttf
          weight: 800
