name: rider
description: Aavagaman — rider app (SPEC §11).
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  ride_shared:
    path: ../shared
  google_maps_flutter: ^2.18.2
  geolocator: ^14.1.1
  url_launcher: ^6.3.3
  razorpay_flutter: ^1.4.7
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  default-flavor: dev
  uses-material-design: true
  generate: true
