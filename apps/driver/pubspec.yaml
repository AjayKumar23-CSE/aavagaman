name: driver
description: Aavagaman Driver — driver app (SPEC §12).
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  ride_shared:
    path: ../shared
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  geolocator: ^14.1.1
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.3.1
  audioplayers: ^6.8.1
  vibration: ^3.2.1
  android_intent_plus: ^6.1.0
  app_settings: ^9.0.0
  url_launcher: ^6.3.3
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  default-flavor: dev
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
