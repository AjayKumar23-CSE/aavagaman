# Local development stack (SPEC §20 Phase 0).
#   docker compose -f infra/docker-compose.yml up --build
# First run downloads a small Delhi OSM extract and builds OSRM data (~5 min).
name: ride-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride
      POSTGRES_DB: ride
    ports: ["5432:5432"]
    shm_size: 256m
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ride -d ride"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # One-shot: fetch the dev extract if not already present.
  osrm-download:
    image: alpine:3.20
    volumes: [osrmdata:/data]
    command:
      - sh
      - -c
      - |
        [ -f /data/ncr.osm.pbf ] && { echo "extract present"; exit 0; }
        wget -O /data/ncr.osm.pbf.part "$${OSRM_DEV_PBF_URL}" && mv /data/ncr.osm.pbf.part /data/ncr.osm.pbf
    environment:
      OSRM_DEV_PBF_URL: https://download.bbbike.org/osm/bbbike/NewDelhi/NewDelhi.osm.pbf

  # One-shot: build MLD data (skipped once built).
  osrm-build:
    image: osrm/osrm-backend
    volumes: [osrmdata:/data]
    depends_on:
      osrm-download: { condition: service_completed_successfully }
    entrypoint: ["sh", "-c"]
    command:
      - |
        [ -f /data/ncr.osrm.mldgr ] && { echo "osrm data present"; exit 0; }
        osrm-extract -p /opt/car.lua /data/ncr.osm.pbf && \
        osrm-partition /data/ncr.osrm && \
        osrm-customize /data/ncr.osrm

  osrm:
    image: osrm/osrm-backend
    command: ["osrm-routed", "--algorithm", "mld", "/data/ncr.osrm"]
    volumes: [osrmdata:/data]
    ports: ["5000:5000"]
    depends_on:
      osrm-build: { condition: service_completed_successfully }

  api:
    build: ../backend
    # Migrate + idempotent seed, then serve.
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed.js && node dist/main.js"]
    ports: ["3000:3000"]
    environment: &api-env
      NODE_ENV: development
      PORT: "3000"
      API_BASE_URL: http://localhost:3000
      ADMIN_ORIGIN: http://localhost:5173
      ENABLE_DOCS: "true"
      DATABASE_URL: postgresql://ride:ride@postgres:5432/ride
      REDIS_URL: redis://redis:6379
      OSRM_BASE_URL: http://osrm:5000
      JWT_ACCESS_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
      OTP_DEV_BYPASS_CODE: "123456"
      OTP_PEPPER: dev-pepper
      LOG_LEVEL: info
      SEED_ADMIN_EMAIL: admin@ride.local
      SEED_ADMIN_PASSWORD: admin12345
      SEED_ADMIN_PHONE: "+910000000000"
      SEED_NCR_GEOJSON: /app/seed/ncr.geojson
      # Presigned URLs are generated offline; point these at a real R2 bucket to upload for real.
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: ride-docs-dev
      S3_ACCESS_KEY_ID: dev
      S3_SECRET_ACCESS_KEY: devsecret
      METRICS_TOKEN: dev-metrics-token
    volumes: ["./seed:/app/seed:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      osrm: { condition: service_started }

  # BullMQ processors: matching, offer timeouts, heartbeat sweeper, payment poll, settlements, retention.
  worker:
    build: ../backend
    command: ["node", "dist/worker.js"]
    environment: *api-env
    depends_on:
      api: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  osrmdata:
