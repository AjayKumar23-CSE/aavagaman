name: apps

on:
  pull_request:
    paths: ['apps/**', '.github/workflows/apps.yml']
  push:
    tags: ['rider-v*', 'driver-v*']

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [shared, rider, driver]
    defaults:
      run:
        working-directory: apps/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter pub outdated

  # Signed prod release builds (SPEC §17.5). Needs secrets <APP>_KEYSTORE_BASE64,
  # <APP>_KEYSTORE_PASSWORD, <APP>_KEY_ALIAS, <APP>_KEY_PASSWORD (APP = RIDER | DRIVER)
  # and the repo variables API_BASE_URL and, optionally, GOOGLE_MAPS_API_KEY / SENTRY_DSN.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        run: |
          name="${GITHUB_REF_NAME%%-v*}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "upper=${name^^}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE_BASE64', steps.app.outputs.upper)] }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secret ${{ steps.app.outputs.upper }}_KEYSTORE_BASE64 is not set; refusing to build a debug-signed release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build
        working-directory: apps/${{ steps.app.outputs.name }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', steps.app.outputs.upper)] }}
          KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', steps.app.outputs.upper)] }}
          KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', steps.app.outputs.upper)] }}
          MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
        run: |
          flutter pub get
          defines="--dart-define=APP_ENV=prod --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} --dart-define=GOOGLE_MAPS_API_KEY=${{ vars.GOOGLE_MAPS_API_KEY }} --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN }}"
          flutter build appbundle --release --flavor prod --build-number=${{ github.run_number }} $defines
          flutter build apk --release --flavor prod --build-number=${{ github.run_number }} $defines
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.name }}-${{ github.ref_name }}
          path: |
            apps/${{ steps.app.outputs.name }}/build/app/outputs/bundle/prodRelease/*.aab
            apps/${{ steps.app.outputs.name }}/build/app/outputs/flutter-apk/app-prod-release.apk
